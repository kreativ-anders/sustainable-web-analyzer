<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API · Sustainable Web Analyzer</title>
  <meta name="description" content="OpenAPI reference of the Sustainable Web Analyzer: request parameters and the JSON response with weight, hosts, cookies and CO2 per visit.">
  <link rel="canonical" href="https://swa.kreativ-anders.dev/api.html">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.33.0/swagger-ui.css" integrity="sha384-Ov4/wv3j2bmct8cDc5X4ngJZohVPzEmc6uDPH8WeljUxO5vtoykvMEfbu9Vh6RaW" crossorigin="anonymous">
  <style>body { margin: 0; background: #fff; }</style>
</head>
<body>
  <main id="swagger-ui">
    <noscript><p>The interactive reference needs JavaScript. Read the <a href="openapi.json">OpenAPI spec</a> directly.</p></noscript>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.33.0/swagger-ui-bundle.js" integrity="sha384-YDALVcy8kj8yltLBVi1vBiBAUqdxvus673gM8XKwiy6aDUJFXivF/KCufekjYbVf" crossorigin="anonymous"></script>
  <script>
    // Swagger UI resolves $refs against the page URL, which fails for file:// – inline them first.
    const dereference = (node, root) => {
      if (Array.isArray(node)) return node.map((item) => dereference(item, root));
      if (node === null || typeof node !== 'object') return node;
      if (typeof node.$ref === 'string' && node.$ref.startsWith('#/')) {
        const { $ref, ...siblings } = node;
        const target = $ref.slice(2).split('/').reduce((parent, key) => parent[key], root);
        return { ...dereference(target, root), ...siblings };
      }
      return Object.fromEntries(Object.entries(node).map(([key, value]) => [key, dereference(value, root)]));
    };

    fetch('openapi.json')
      .then((response) => response.json())
      .then((spec) => SwaggerUIBundle({
        spec: dereference(spec, spec),
        dom_id: '#swagger-ui',
        supportedSubmitMethods: [],
        defaultModelRendering: 'model',
        defaultModelExpandDepth: 3,
        defaultModelsExpandDepth: 3,
      }))
      .catch((error) => {
        document.getElementById('swagger-ui').textContent = 'Could not load openapi.json: ' + error.message;
      });
  </script>
</body>
</html>
